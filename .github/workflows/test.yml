name: Test

on:
  workflow_call:
    inputs:
      runner_config:
        required: true
        type: string
        description: 'Runner configuration JSON (from runner availability check)'

jobs:
  test:
    runs-on: ${{ fromJSON(inputs.runner_config) }}
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # Required for Trivy SARIF upload
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.ref }}
          token: ${{ github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          # Restores ~/.npm keyed on the lockfile hash, so the install below
          # starts warm instead of resolving the whole tree from the registry.
          cache: npm

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: false # No Python deps to cache in this Node.js app

      - name: Install Dependencies
        timeout-minutes: 5
        # npm ci installs from the lockfile instead of re-resolving it, and
        # fails loudly if the two ever disagree rather than quietly rewriting
        # package-lock.json mid-run.
        run: npm ci

      - name: Run Tests
        timeout-minutes: 2
        run: npm test

      - name: Run Type Check
        timeout-minutes: 2
        run: npm run typecheck

      - name: Run Lint
        timeout-minutes: 2
        run: npm run lint

      - name: Check Formatting
        timeout-minutes: 1
        run: npm run format:check

      - name: Run Build
        timeout-minutes: 5
        run: npm run build

      - name: Lint CloudFormation templates
        timeout-minutes: 1
        run: |
          echo "🔍 Linting CloudFormation templates..."
          uvx cfn-lint

      - name: Scan dependencies for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          scanners: 'vuln'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'dependency-scan'
