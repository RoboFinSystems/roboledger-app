name: Deploy App

on:
  workflow_call:
    inputs:
      # GHA Runner Configuration
      runner_config:
        description: 'GitHub Actions runner configuration (JSON array)'
        required: false
        type: string
        default: '["ubuntu-latest"]'

      # Environment & AWS Configuration
      environment:
        description: 'Environment to deploy to (prod, staging, or dev)'
        required: true
        type: string
      aws_account_id:
        description: 'AWS Account ID for cross-account resources'
        required: true
        type: string
      aws_region:
        description: 'AWS region for deployment'
        required: true
        type: string
      stack_name:
        description: 'CloudFormation stack name'
        required: true
        type: string

      # Access Mode Configuration
      app_access_mode:
        description: |
          App access mode:
          - public: CloudFront + custom domain + HTTPS (requires domain)
          - public-http: CloudFront with AWS DNS, no custom domain needed
        required: false
        type: string
        default: 'public'

      # S3 Bucket Configuration (passed from deploy-s3 workflow outputs)
      static_assets_bucket_name:
        description: 'S3 bucket name for static assets'
        required: true
        type: string
      static_assets_bucket_arn:
        description: 'S3 bucket ARN for static assets'
        required: true
        type: string
      static_assets_bucket_domain:
        description: 'S3 bucket regional domain name for static assets'
        required: true
        type: string

      # Container & Application Configuration
      ecr_repository:
        description: 'ECR repository name'
        required: true
        type: string
      ecr_image_tag:
        description: 'Docker image tag'
        required: true
        type: string

      # Compute Configuration
      app_compute:
        description: |
          Compute route for the app service:
          - apprunner: AWS App Runner (cloudformation/template.yaml)
          - ecs-express: Amazon ECS Express Mode (cloudformation/template-ecs-express.yaml).
            Use this in an AWS account that has never used App Runner, which is
            closed to new customers.
        required: false
        type: string
        default: 'apprunner'
      ecs_subnets:
        description: 'Comma-separated public subnet IDs for ecs-express (empty = default VPC)'
        required: false
        type: string
        default: ''
      cpu:
        description: 'CPU in App Runner form ("0.25 vCPU"); translated to task CPU units for ecs-express'
        required: false
        type: string
        default: '0.25 vCPU'
      memory:
        description: 'Memory in App Runner form ("0.5 GB"); translated to MiB for ecs-express'
        required: false
        type: string
        default: '0.5 GB'

      # Auto-scaling Configuration
      capacity_min:
        description: 'Minimum number of instances for auto scaling'
        required: false
        type: string
        default: '1'
      capacity_max:
        description: 'Maximum number of instances for auto scaling'
        required: false
        type: string
        default: '10'
      max_concurrency:
        description: 'Maximum concurrent requests per instance before scaling (apprunner only)'
        required: false
        type: string
        default: '100'

      # Domain & DNS Configuration (required only when app_access_mode=public)
      domain_name:
        description: 'Full domain name for the application (e.g., roboledger.ai). Required for public mode.'
        required: false
        type: string
        default: ''
      domain_name_root:
        description: 'Root domain name for Route 53 hosted zone. Required for public mode.'
        required: false
        type: string
        default: ''

      # SNS Configuration
      notification_email:
        description: 'Email address for admin notifications (contact form)'
        required: true
        type: string

jobs:
  deploy:
    runs-on: ${{ fromJSON(inputs.runner_config) }}
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.ref }}
          token: ${{ github.token }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region }}

      - name: Get Secret ARNs
        id: get-arns
        run: |
          # Get main RoboSystems secrets ARN
          ROBOSYSTEMS_SECRETS_ARN=$(aws secretsmanager describe-secret \
            --secret-id "robosystems/${{ inputs.environment }}" \
            --query "ARN" --output text)

          echo "robosystems_secrets_arn=$ROBOSYSTEMS_SECRETS_ARN" >> $GITHUB_OUTPUT
          echo "Found RoboSystems secret ARN: $ROBOSYSTEMS_SECRETS_ARN"

      - name: Deploy RoboLedger CloudFormation Stack
        id: deploy-stack
        env:
          ORIGIN_VERIFY_SECRET: ${{ secrets.ORIGIN_VERIFY_SECRET }}
        run: |
          # Pick the template and translate task sizing for the compute route
          case "${{ inputs.app_compute }}" in
            apprunner)
              TEMPLATE_FILE=cloudformation/template.yaml
              CPU="${{ inputs.cpu }}"
              MEMORY="${{ inputs.memory }}"
              ;;
            ecs-express)
              TEMPLATE_FILE=cloudformation/template-ecs-express.yaml
              case "${{ inputs.cpu }}" in
                '0.25 vCPU'|256) CPU=256 ;;
                '0.5 vCPU'|512) CPU=512 ;;
                '1 vCPU'|1024) CPU=1024 ;;
                '2 vCPU'|2048) CPU=2048 ;;
                *) echo "ERROR: unsupported cpu '${{ inputs.cpu }}' for ecs-express"; exit 1 ;;
              esac
              case "${{ inputs.memory }}" in
                '0.5 GB'|512) MEMORY=512 ;;
                '1 GB'|1024) MEMORY=1024 ;;
                '2 GB'|2048) MEMORY=2048 ;;
                '3 GB'|3072) MEMORY=3072 ;;
                '4 GB'|4096) MEMORY=4096 ;;
                *) echo "ERROR: unsupported memory '${{ inputs.memory }}' for ecs-express"; exit 1 ;;
              esac
              ;;
            *)
              echo "ERROR: app_compute must be apprunner or ecs-express, got '${{ inputs.app_compute }}'"
              exit 1
              ;;
          esac
          echo "Compute route: ${{ inputs.app_compute }} ($TEMPLATE_FILE, cpu=$CPU, memory=$MEMORY)"

          # Look up hosted zone ID only for public mode (requires custom domain)
          HOSTED_ZONE_ID=""
          if [ "${{ inputs.app_access_mode }}" = "public" ]; then
            if [ -z "${{ inputs.domain_name_root }}" ]; then
              echo "ERROR: domain_name_root is required for public access mode"
              exit 1
            fi
            HOSTED_ZONE_ID=$(aws route53 list-hosted-zones | jq -r ".HostedZones[] | select(.Name==\"${{ inputs.domain_name_root }}.\") | .Id" | cut -d'/' -f3)
            if [ -z "$HOSTED_ZONE_ID" ]; then
              echo "ERROR: No hosted zone found for domain ${{ inputs.domain_name_root }}"
              exit 1
            fi
            echo "Found hosted zone ID: $HOSTED_ZONE_ID for domain ${{ inputs.domain_name_root }}"
          else
            echo "Skipping hosted zone lookup for ${{ inputs.app_access_mode }} mode"
          fi

          # Pick the stack action from the stack's actual state. A first create
          # that failed leaves an empty ROLLBACK_COMPLETE stack that cannot be
          # updated; a failed update whose rollback also failed cannot be
          # updated until that rollback is continued.
          if ! STACK_STATUS=$(aws cloudformation describe-stacks \
            --stack-name ${{ inputs.stack_name }} \
            --query 'Stacks[0].StackStatus' --output text 2>&1); then
            if echo "$STACK_STATUS" | grep -q "does not exist"; then
              STACK_STATUS="DOES_NOT_EXIST"
            else
              echo "ERROR: could not describe stack ${{ inputs.stack_name }}: $STACK_STATUS"
              exit 1
            fi
          fi
          echo "Stack ${{ inputs.stack_name }} status: $STACK_STATUS"

          case "$STACK_STATUS" in
            DOES_NOT_EXIST)
              STACK_ACTION="create-stack"
              ;;
            ROLLBACK_COMPLETE)
              echo "Failed initial create left an empty stack - deleting it so it can be created again"
              aws cloudformation delete-stack --stack-name ${{ inputs.stack_name }}
              aws cloudformation wait stack-delete-complete --stack-name ${{ inputs.stack_name }}
              STACK_ACTION="create-stack"
              ;;
            UPDATE_ROLLBACK_FAILED)
              echo "Previous update's rollback did not finish - continuing it before updating"
              aws cloudformation continue-update-rollback --stack-name ${{ inputs.stack_name }}
              aws cloudformation wait stack-rollback-complete --stack-name ${{ inputs.stack_name }}
              STACK_ACTION="update-stack"
              ;;
            DELETE_COMPLETE)
              STACK_ACTION="create-stack"
              ;;
            DELETE_FAILED)
              echo "ERROR: stack is DELETE_FAILED - resolve the stuck deletion by hand, then rerun"
              exit 1
              ;;
            *_IN_PROGRESS)
              echo "ERROR: stack is busy ($STACK_STATUS) - wait for the current operation to finish, then rerun"
              exit 1
              ;;
            *)
              STACK_ACTION="update-stack"
              ;;
          esac

          if [ "$STACK_ACTION" = "create-stack" ]; then
            echo "Creating new stack ${{ inputs.stack_name }}"
            echo "is_new_stack=true" >> $GITHUB_OUTPUT
          else
            echo "Updating existing stack ${{ inputs.stack_name }}"
            echo "is_new_stack=false" >> $GITHUB_OUTPUT
          fi

          # Build parameters JSON file (handles spaces in values correctly)
          cat > /tmp/cfn-params.json << 'PARAMS_EOF'
          [
            {"ParameterKey": "Environment", "ParameterValue": "${{ inputs.environment }}"},
            {"ParameterKey": "AWSAccountId", "ParameterValue": "${{ inputs.aws_account_id }}"},
            {"ParameterKey": "AppAccessMode", "ParameterValue": "${{ inputs.app_access_mode }}"},
            {"ParameterKey": "RoboSystemsSecretsArn", "ParameterValue": "${{ steps.get-arns.outputs.robosystems_secrets_arn }}"},
            {"ParameterKey": "ECRRepository", "ParameterValue": "${{ inputs.ecr_repository }}"},
            {"ParameterKey": "ECRImageTag", "ParameterValue": "${{ inputs.ecr_image_tag }}"},
            {"ParameterKey": "StaticAssetsBucketName", "ParameterValue": "${{ inputs.static_assets_bucket_name }}"},
            {"ParameterKey": "StaticAssetsBucketArn", "ParameterValue": "${{ inputs.static_assets_bucket_arn }}"},
            {"ParameterKey": "StaticAssetsBucketDomainName", "ParameterValue": "${{ inputs.static_assets_bucket_domain }}"},
            {"ParameterKey": "CapacityMin", "ParameterValue": "${{ inputs.capacity_min }}"},
            {"ParameterKey": "CapacityMax", "ParameterValue": "${{ inputs.capacity_max }}"},
            {"ParameterKey": "NotificationEmail", "ParameterValue": "${{ inputs.notification_email }}"}
          ]
          PARAMS_EOF

          # Add domain parameters only for public mode
          if [ "${{ inputs.app_access_mode }}" = "public" ]; then
            sed -i '$ d' /tmp/cfn-params.json
            cat >> /tmp/cfn-params.json << DOMAIN_EOF
            ,{"ParameterKey": "DomainName", "ParameterValue": "${{ inputs.domain_name }}"},
            {"ParameterKey": "HostedZoneId", "ParameterValue": "$HOSTED_ZONE_ID"}
          ]
          DOMAIN_EOF
          fi

          jq --arg cpu "$CPU" --arg memory "$MEMORY" \
            '. + [{"ParameterKey": "Cpu", "ParameterValue": $cpu},
                  {"ParameterKey": "Memory", "ParameterValue": $memory}]' \
            /tmp/cfn-params.json > /tmp/cfn-params.next.json
          mv /tmp/cfn-params.next.json /tmp/cfn-params.json

          if [ "${{ inputs.app_compute }}" = "ecs-express" ] && [ -n "${{ inputs.ecs_subnets }}" ]; then
            jq --arg v "${{ inputs.ecs_subnets }}" \
              '. + [{"ParameterKey": "Subnets", "ParameterValue": $v}]' \
              /tmp/cfn-params.json > /tmp/cfn-params.next.json
            mv /tmp/cfn-params.next.json /tmp/cfn-params.json
          fi

          # Concurrency-based scaling exists only on App Runner
          if [ "${{ inputs.app_compute }}" = "apprunner" ]; then
            jq --arg v "${{ inputs.max_concurrency }}" \
              '. + [{"ParameterKey": "MaxConcurrency", "ParameterValue": $v}]' \
              /tmp/cfn-params.json > /tmp/cfn-params.next.json
            mv /tmp/cfn-params.next.json /tmp/cfn-params.json
          fi

          echo "Parameters:"
          cat /tmp/cfn-params.json

          # Appended after the listing so the value never reaches the log. When
          # the GitHub secret is missing, a stack that already has the parameter
          # keeps its previous value rather than silently resetting to empty.
          if [ -n "$ORIGIN_VERIFY_SECRET" ]; then
            jq --arg v "$ORIGIN_VERIFY_SECRET" \
              '. + [{"ParameterKey": "OriginVerifySecret", "ParameterValue": $v}]' \
              /tmp/cfn-params.json > /tmp/cfn-params.next.json
            mv /tmp/cfn-params.next.json /tmp/cfn-params.json
          elif [ "$STACK_ACTION" = "update-stack" ] && aws cloudformation describe-stacks \
            --stack-name ${{ inputs.stack_name }} \
            --query "Stacks[0].Parameters[?ParameterKey=='OriginVerifySecret'].ParameterKey" \
            --output text | grep -q OriginVerifySecret; then
            jq '. + [{"ParameterKey": "OriginVerifySecret", "UsePreviousValue": true}]' \
              /tmp/cfn-params.json > /tmp/cfn-params.next.json
            mv /tmp/cfn-params.next.json /tmp/cfn-params.json
          fi

          # Deploy or update the stack
          if [ "$STACK_ACTION" = "create-stack" ]; then
            # Create new stack
            aws cloudformation $STACK_ACTION \
              --stack-name ${{ inputs.stack_name }} \
              --template-body file://$TEMPLATE_FILE \
              --capabilities CAPABILITY_NAMED_IAM \
              --parameters file:///tmp/cfn-params.json
          else
            # Update existing stack, handling "No updates" error
            UPDATE_OUTPUT=$(aws cloudformation $STACK_ACTION \
              --stack-name ${{ inputs.stack_name }} \
              --template-body file://$TEMPLATE_FILE \
              --capabilities CAPABILITY_NAMED_IAM \
              --parameters file:///tmp/cfn-params.json 2>&1) || true

            # Check if the error was "No updates are to be performed"
            if echo "$UPDATE_OUTPUT" | grep -q "No updates are to be performed"; then
              echo "Stack is already up to date - no changes needed"
              echo "is_new_stack=false" >> $GITHUB_OUTPUT
            elif echo "$UPDATE_OUTPUT" | grep -q "error"; then
              echo "Error updating stack: $UPDATE_OUTPUT"
              exit 1
            else
              echo "Stack update initiated successfully"
              echo "is_new_stack=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Monitor Stack Deployment
        uses: RoboFinSystems/robosystems/.github/actions/monitor-stack-deployment@main
        with:
          stack-name: ${{ inputs.stack_name }}
          timeout: '1800'
          interval: '10'

      - name: Get Service Info
        id: get-service-info
        run: |
          SERVICE_ARN=$(aws cloudformation describe-stacks \
            --stack-name ${{ inputs.stack_name }} \
            --query "Stacks[0].Outputs[?OutputKey=='ServiceArn'].OutputValue" \
            --output text)

          echo "service_arn=$SERVICE_ARN" >> $GITHUB_OUTPUT
          echo "Service ARN: $SERVICE_ARN"

          SERVICE_URL=$(aws cloudformation describe-stacks \
            --stack-name ${{ inputs.stack_name }} \
            --query "Stacks[0].Outputs[?OutputKey=='ServiceUrl'].OutputValue" \
            --output text)
          SERVICE_URL="${SERVICE_URL#https://}"

          echo "service_url=$SERVICE_URL" >> $GITHUB_OUTPUT
          echo "Service URL: $SERVICE_URL"

      - name: Wait for App Runner Deployment
        if: inputs.app_compute == 'apprunner'
        run: |
          SERVICE_ARN="${{ steps.get-service-info.outputs.service_arn }}"
          MAX_ATTEMPTS=60
          SLEEP_INTERVAL=10

          echo "Waiting for App Runner service to become ready..."

          for i in $(seq 1 $MAX_ATTEMPTS); do
            STATUS=$(aws apprunner describe-service \
              --service-arn "$SERVICE_ARN" \
              --query "Service.Status" \
              --output text)

            echo "Attempt $i/$MAX_ATTEMPTS: Service status is $STATUS"

            if [ "$STATUS" = "RUNNING" ]; then
              echo "App Runner service is running!"
              break
            elif [ "$STATUS" = "CREATE_FAILED" ] || [ "$STATUS" = "DELETE_FAILED" ] || [ "$STATUS" = "UPDATE_FAILED" ]; then
              echo "ERROR: App Runner service deployment failed with status: $STATUS"
              exit 1
            fi

            if [ $i -eq $MAX_ATTEMPTS ]; then
              echo "ERROR: Timeout waiting for App Runner service to become ready"
              exit 1
            fi

            sleep $SLEEP_INTERVAL
          done

      # The Express service reports only ACTIVE/DRAINING/INACTIVE, and ACTIVE
      # says nothing about the rollout, so watch the ECS service it manages
      # until its primary deployment completes (canary rollouts take a while).
      - name: Wait for ECS Express Deployment
        if: inputs.app_compute == 'ecs-express'
        run: |
          SERVICE_ARN="${{ steps.get-service-info.outputs.service_arn }}"
          MAX_ATTEMPTS=90
          SLEEP_INTERVAL=10

          read -r STATUS CLUSTER SERVICE_NAME < <(aws ecs describe-express-gateway-service \
            --service-arn "$SERVICE_ARN" \
            --query "[service.status.statusCode, service.cluster, service.serviceName]" \
            --output text)
          echo "Express service $SERVICE_NAME on cluster $CLUSTER is $STATUS"
          if [ "$STATUS" != "ACTIVE" ]; then
            echo "ERROR: Express service is not ACTIVE"
            exit 1
          fi

          echo "Waiting for the ECS deployment to complete..."

          for i in $(seq 1 $MAX_ATTEMPTS); do
            read -r DEPLOYMENTS ROLLOUT < <(aws ecs describe-services \
              --cluster "$CLUSTER" \
              --services "$SERVICE_NAME" \
              --query "services[0].[length(deployments), deployments[?status=='PRIMARY'] | [0].rolloutState]" \
              --output text)

            echo "Attempt $i/$MAX_ATTEMPTS: primary rollout $ROLLOUT, $DEPLOYMENTS deployment(s)"

            if [ "$ROLLOUT" = "COMPLETED" ] && [ "$DEPLOYMENTS" = "1" ]; then
              echo "ECS Express deployment completed!"
              break
            elif [ "$ROLLOUT" = "FAILED" ]; then
              echo "ERROR: ECS deployment failed:"
              aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE_NAME" \
                --query "services[0].deployments[?status=='PRIMARY'] | [0].rolloutStateReason" \
                --output text
              exit 1
            fi

            if [ $i -eq $MAX_ATTEMPTS ]; then
              echo "ERROR: Timeout waiting for the ECS deployment to complete"
              exit 1
            fi

            sleep $SLEEP_INTERVAL
          done

      - name: Verify Health Check
        run: |
          SERVICE_URL="${{ steps.get-service-info.outputs.service_url }}"
          HEALTH_URL="https://${SERVICE_URL}/api/utilities/health"

          echo "Checking health endpoint: $HEALTH_URL"

          # Wait for health check to pass
          MAX_ATTEMPTS=12
          for i in $(seq 1 $MAX_ATTEMPTS); do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" || echo "000")

            if [ "$HTTP_STATUS" = "200" ]; then
              echo "Health check passed! HTTP $HTTP_STATUS"
              break
            fi

            echo "Attempt $i/$MAX_ATTEMPTS: Health check returned HTTP $HTTP_STATUS"

            if [ $i -eq $MAX_ATTEMPTS ]; then
              echo "ERROR: Health check did not return 200 after $MAX_ATTEMPTS attempts"
              exit 1
            fi

            sleep 10
          done

      - name: Update Deployment Status
        if: always()
        run: |
          if [ "${{ steps.deploy-stack.outputs.is_new_stack }}" == "true" ]; then
            echo "RoboLedger app stack creation completed"
          else
            echo "RoboLedger app stack update completed"
          fi

          echo ""
          echo "Service URL (${{ inputs.app_compute }}): ${{ steps.get-service-info.outputs.service_url }}"
