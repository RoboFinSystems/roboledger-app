name: Claude Code Review

on:
  pull_request:
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

# One review per PR at a time. A rapid draft->ready->draft toggle would otherwise
# stack runs and burn Claude usage on states nobody is waiting for.
concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: true

jobs:
  check-runner-availability:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      runners_available: ${{ steps.check.outputs.runners_available }}
      runner_type: ${{ steps.check.outputs.runner_type }}
      runner_config: ${{ steps.check.outputs.runner_config }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check runner availability
        id: check
        uses: ./.github/actions/runner-availability
        with:
          runner_labels: ${{ vars.RUNNER_LABELS || 'github-hosted' }}
          runner_scope: ${{ vars.RUNNER_SCOPE || 'both' }}
          # ACTIONS_TOKEN needed for org runner API access; falls back to github.token
          # which has limited permissions but action handles this gracefully
          github_token: ${{ secrets.ACTIONS_TOKEN || github.token }}

  claude:
    needs: [check-runner-availability]
    # SECURITY (M6): defense-in-depth author gate. On top of the action's own
    # permission check, only run when the triggering actor is a repo
    # OWNER/MEMBER/COLLABORATOR, so a drive-by comment/issue from an outside
    # account can never invoke Claude with repo secrets in scope.
    if: |
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
      ) ||
      (
        github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      ) ||
      (
        github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      ) ||
      (
        github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)
      ) ||
      (
        github.event_name == 'issues' &&
        (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
      )
    runs-on: ${{ fromJSON(needs.check-runner-availability.outputs.runner_config) }}
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read # Required for Claude to read CI results on PRs
      # Required: claude-code-action mints a GitHub OIDC token to authenticate
      # to GitHub (setupGitHubToken → getOidcToken), independent of any cloud
      # role. Without it the action fails: "Could not fetch an OIDC token."
      # (This is GitHub auth, not AWS — do not drop it as "unused".)
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # On the automatic pull_request trigger there is no comment to act on, so
          # supply the review brief. Left empty for comment-driven events so Claude
          # follows the instructions in the comment that tagged it.
          #
          # Deliberately does NOT approve: org policy sets
          # can_approve_pull_request_reviews=false, and an unconditional bot approval
          # on every PR is a rubber stamp - worse audit evidence than none.
          prompt: ${{ github.event_name == 'pull_request' && 'Review this pull request. This is a Next.js frontend maintained by a single engineer who cannot approve their own PRs, so this review is the compensating change-management control - be substantive rather than cursory. Focus on correctness bugs, any handling of auth tokens or user data, accessibility regressions, and whether the PR description matches the diff. Post your findings as a comment. Do not approve the pull request.' || '' }}

          # Optional: Add claude_args to customize behavior and configuration
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://docs.claude.com/en/docs/claude-code/cli-reference for available options
          # claude_args: '--allowed-tools Bash(gh pr:*)'
