name: Docker Hub

# Publishes the self-host image (linux/amd64 + linux/arm64) to Docker Hub.
# Called by prod.yml AFTER the production deploy; nothing depends on this
# workflow, so a Docker Hub failure shows red here without blocking a release.
# The caller gates it on DOCKERHUB_PUBLISHING_ENABLED and a release ref.

on:
  workflow_call:
    inputs:
      runner_config:
        required: false
        type: string
        description: 'Runner configuration JSON (from runner availability check)'
        default: '["ubuntu-latest"]'
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

jobs:
  dockerhub-build:
    runs-on: ${{ fromJSON(inputs.runner_config) }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Free disk space
        run: |
          echo "Disk space before cleanup:"
          df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          echo "Disk space after cleanup:"
          df -h /

      - name: Checkout
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.ref }}
          token: ${{ github.token }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        with:
          driver-opts: |
            image=moby/buildkit:master
            network=host

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies and build Next.js with placeholders
        env:
          # Use placeholder values that will be replaced at runtime by entrypoint.sh.
          # The app name is identity, not configuration — bake the literal.
          NEXT_PUBLIC_APP_NAME: roboledger
          NEXT_PUBLIC_ROBOSYSTEMS_API_URL: '__PLACEHOLDER_ROBOSYSTEMS_API_URL__'
          NEXT_PUBLIC_ROBOLEDGER_APP_URL: '__PLACEHOLDER_ROBOLEDGER_APP_URL__'
          NEXT_PUBLIC_ROBOINVESTOR_APP_URL: '__PLACEHOLDER_ROBOINVESTOR_APP_URL__'
          NEXT_PUBLIC_ROBOSYSTEMS_APP_URL: '__PLACEHOLDER_ROBOSYSTEMS_APP_URL__'
          NEXT_PUBLIC_MAINTENANCE_MODE: '__PLACEHOLDER_MAINTENANCE_MODE__'
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: '__PLACEHOLDER_TURNSTILE_SITE_KEY__'
          NEXT_PUBLIC_CF_ANALYTICS_TOKEN: '__PLACEHOLDER_CF_ANALYTICS_TOKEN__'
          NEXT_PUBLIC_S3_ENDPOINT_URL: '__PLACEHOLDER_S3_ENDPOINT_URL__'
        run: |
          npm ci
          npm run build

          # Create a tarball of the build output for Docker to use
          tar -czf next-build.tar.gz .next

      - name: Determine version tag
        id: version
        run: |
          VERSION_TAG=""
          IS_RELEASE="false"

          # Check if this is a version tag (v*.*.*)
          if [[ "$GITHUB_REF" == refs/tags/v*.*.* ]]; then
            VERSION_TAG=${GITHUB_REF#refs/tags/}
            IS_RELEASE="true"
            echo "📦 Release version: $VERSION_TAG"
          # Check if this is a release branch (release/*)
          elif [[ "$GITHUB_REF" == refs/heads/release/* ]]; then
            BRANCH_VERSION=${GITHUB_REF#refs/heads/release/}
            VERSION_TAG="v${BRANCH_VERSION}-hotfix.${GITHUB_SHA:0:8}"
            IS_RELEASE="true"
            echo "🔥 Hotfix version: $VERSION_TAG"
          else
            VERSION_TAG="git-${GITHUB_SHA:0:8}"
            echo "🔧 Development version: $VERSION_TAG"
          fi

          echo "version_tag=$VERSION_TAG" >> $GITHUB_OUTPUT
          echo "is_release=$IS_RELEASE" >> $GITHUB_OUTPUT

      - name: Build and push to Docker Hub
        if: steps.version.outputs.is_release == 'true'
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4
        env:
          VERSION_TAG: ${{ steps.version.outputs.version_tag }}
        with:
          timeout_minutes: 8
          max_attempts: 2
          retry_on: any
          command: |
            export DOCKER_BUILDKIT=1
            export COMPOSE_DOCKER_CLI_BUILD=1

            # Prepare Docker Hub tags
            TAGS="-t robofinsystems/roboledger-app:latest"
            TAGS="$TAGS -t robofinsystems/roboledger-app:$VERSION_TAG"

            echo "🚀 Publishing configurable image to Docker Hub"

            # Build for both amd64 and arm64 (for Mac M1/M2 users). The Dockerfile
            # keeps every Node step on the build platform, so the arm64 half is
            # file copies under QEMU, not an emulated npm.
            # SBOM and provenance attestations improve Docker Hub security score
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --push \
              --sbom=true \
              --provenance=mode=max \
              $TAGS \
              -f Dockerfile .

            echo "📋 Docker Hub image tags created:"
            echo "$TAGS" | tr ' ' '\n' | grep -E '^-t' | sed 's/-t /  - /'

      - name: Skip non-release build
        if: steps.version.outputs.is_release != 'true'
        run: |
          echo "⏭️ Skipping Docker Hub publication (non-release build)"
          echo "Docker Hub images are only published for version tags (v*.*.*) and release branches"
