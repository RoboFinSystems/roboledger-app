version: 2

updates:
  # npm — package.json and package-lock.json dependencies
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
    labels:
      - 'dependencies'
    # Routine minor/patch churn arrives as two PRs instead of a dozen.
    # Majors are deliberately left ungrouped: they need individual triage,
    # and grouping them would force an all-or-nothing call on unrelated bumps.
    # vite-toolchain is the exception and is listed first (a dependency joins
    # the first group it matches): those packages are peer-locked to each
    # other, so they are already one decision, and splitting them produces
    # PRs that cannot go green alone.
    groups:
      # vitest peers vite, @vitest/coverage-v8 peers vitest at an exact
      # version, and @vitejs/plugin-react peers vite. No update-types filter,
      # so majors travel together too — @vitejs/plugin-react 6 requires
      # vite ^8, and the two arriving as separate PRs deadlocks both.
      vite-toolchain:
        patterns:
          - 'vite'
          - 'vitest'
          - '@vitejs/*'
          - '@vitest/*'
      npm-production:
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'
      npm-development:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      # Blocked upstream, not by us: eslint-plugin-jsx-a11y (6.10.2, latest)
      # peers eslint "^3 || ... || ^9" and eslint-plugin-react (7.37.5) caps at
      # ^9.7, so eslint 10 fails `npm install` with ERESOLVE and can never go
      # green. Drop this entry once either plugin ships ESLint 10 peer support.
      - dependency-name: 'eslint'
        update-types:
          - 'version-update:semver-major'
      # Blocked upstream: @typescript-eslint/eslint-plugin (8.65.0, latest)
      # peers typescript ">=4.8.4 <6.1.0". TypeScript 7 is also the native Go
      # port, so it is a migration to schedule rather than a bump to take.
      # Drop this entry once typescript-eslint v9 supports the 7.x line.
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'
      # @types/node tracks the runtime, not npm's cadence. Everything here runs
      # Node 24 (engines >=24.0.0, node-version: '24' in every workflow), and
      # Node 26 types describe APIs the runtime does not have — typecheck keeps
      # passing precisely because the guardrail is gone. Offered and declined
      # three times across the frontends (Aug and Sep 2026). Drop this entry
      # when the workflows move off Node 24.
      - dependency-name: '@types/node'
        update-types:
          - 'version-update:semver-major'

  # GitHub Actions — pinned action versions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    labels:
      - 'dependencies'
    # Same split: routine SHA re-pins batch into one PR, majors stay separate
    # so a wanted major (setup-node v7) is not tied to an unwanted one.
    groups:
      github-actions:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      # Held for fleet consistency with the robosystems backend, which pins
      # v8.3.2 and ignores majors because v9 flipped `prune-cache` to false and
      # would grow its uv cache. That reasoning does not apply here — this app
      # sets `enable-cache: false` and only needs `uvx` on PATH for cfn-lint,
      # so v9's and v10's breaking changes are both inert. The hold is about
      # one rule across the fleet rather than a per-repo risk assessment, and
      # about not re-triaging the same declined PR every month. Drop this entry
      # when the backend takes a setup-uv major, and move in step with it.
      - dependency-name: 'astral-sh/setup-uv'
        update-types:
          - 'version-update:semver-major'

  # Docker — the Node base image in the Dockerfile
  # OpenSSL is statically linked into the Node binary, so OpenSSL fixes reach
  # this image only through a new base tag; without this ecosystem nothing
  # watches that tag and the bump has to be remembered by hand.
  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'monthly'
    labels:
      - 'dependencies'
    ignore:
      # Node majors are runtime migrations: engines >=24.0.0, node-version: '24'
      # in every workflow, and @types/node held at 24 above. Take them
      # deliberately and in step with the workflows, not as a tag bump.
      - dependency-name: 'public.ecr.aws/docker/library/node'
        update-types:
          - 'version-update:semver-major'
