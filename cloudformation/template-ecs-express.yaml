Description: RoboLedger App Service - Amazon ECS Express Mode

Parameters:
  # Environment & AWS Configuration
  Environment:
    Type: String
    Default: prod
    AllowedValues:
      - prod
      - staging
      - dev
    Description: Environment name (prod, staging, or dev)
    ConstraintDescription: Environment must be prod, staging, or dev

  AWSAccountId:
    Type: String
    Description: AWS Account ID for cross-account resources
    AllowedPattern: '[0-9]{12}'

  # Access Mode Configuration
  AppAccessMode:
    Type: String
    Default: public
    AllowedValues:
      - public
      - public-http
    Description: |
      App access mode:
      - public: CloudFront + custom domain + HTTPS (requires DomainName and HostedZoneId)
      - public-http: CloudFront with AWS DNS, no custom domain needed

  # Domain & DNS Configuration (required only when AppAccessMode=public)
  DomainName:
    Type: String
    Default: ''
    Description: Full domain name for the application (e.g., roboledger.ai). Required for public mode.

  HostedZoneId:
    Type: String
    Default: ''
    Description: Route53 Hosted Zone ID for the domain. Required for public mode.

  # S3 Bucket Configuration (passed from deploy-s3 workflow outputs)
  StaticAssetsBucketName:
    Type: String
    Description: S3 bucket name for static assets (from deploy-s3 workflow)

  StaticAssetsBucketArn:
    Type: String
    Description: S3 bucket ARN for static assets (from deploy-s3 workflow)

  StaticAssetsBucketDomainName:
    Type: String
    Description: S3 bucket regional domain name for static assets (from deploy-s3 workflow)

  # Container & Application Configuration
  ECRRepository:
    Type: String
    Description: ECR repository name
    Default: roboledger-app

  ECRImageTag:
    Type: String
    Description: Docker image tag
    Default: latest

  ContainerPort:
    Type: Number
    Default: 3000
    MinValue: 1
    MaxValue: 65535
    Description: Port the container listens on

  # ECS Express Compute Configuration (Fargate task sizes; not every
  # CPU/memory pairing is valid, e.g. 512 CPU needs at least 1024 MiB)
  Cpu:
    Type: String
    Default: '256'
    Description: CPU units for the ECS task (256 = 0.25 vCPU)
    AllowedValues:
      - '256'
      - '512'
      - '1024'
      - '2048'

  Memory:
    Type: String
    Default: '512'
    Description: Memory in MiB for the ECS task
    AllowedValues:
      - '512'
      - '1024'
      - '2048'
      - '3072'
      - '4096'

  # Network Configuration
  Subnets:
    Type: CommaDelimitedList
    Default: ''
    Description: |
      Public subnet IDs for the service and its load balancer, across at least
      two AZs. Leave empty to use the default VPC's public subnets; required in
      an account without a default VPC. Every Express service in a VPC must use
      subnets in the AZs of the load balancer they share.

  # Auto-scaling Configuration
  CapacityMin:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 25
    Description: Minimum number of tasks for auto scaling

  CapacityMax:
    Type: Number
    Default: 10
    MinValue: 1
    MaxValue: 25
    Description: Maximum number of tasks for auto scaling

  # Secrets Configuration
  RoboSystemsSecretsArn:
    Type: String
    Description: ARN of the main application configuration secret
    AllowedPattern: ^arn:aws:secretsmanager:[a-z0-9-]+:[0-9]+:secret:.*$
    ConstraintDescription: Must be a valid Secrets Manager ARN

  # SNS Configuration
  NotificationEmail:
    Type: String
    Default: ''
    Description: Email address for admin notifications (leave empty to skip SNS setup)

  # CloudFront → origin verification
  OriginVerifySecret:
    Type: String
    Default: ''
    NoEcho: true
    Description: Shared secret CloudFront sends to the ECS origin (leave empty to disable)

  # Tagging Configuration
  ServiceTag:
    Type: String
    Default: RoboLedger
    Description: Tag value for Service identification

  ComponentTag:
    Type: String
    Default: App
    Description: Tag value for Component identification

Conditions:
  # Access mode conditions
  IsPublicMode: !Equals [!Ref AppAccessMode, 'public']
  IsPublicHttpMode: !Equals [!Ref AppAccessMode, 'public-http']

  # Check if SNS notification should be created
  CreateSNSTopic: !Not
    - !Equals
      - !Ref NotificationEmail
      - ''

  HasOriginVerifySecret: !Not
    - !Equals
      - !Ref OriginVerifySecret
      - ''

  # Production + public mode: enables www.domain.com redirect to domain.com
  IsProductionPublic: !And
    - !Equals [!Ref Environment, 'prod']
    - !Equals [!Ref AppAccessMode, 'public']

  HasSubnets: !Not
    - !Equals
      - !Join ['', !Ref Subnets]
      - ''

Resources:
  # ACM Certificate (only for public mode with custom domain)
  # Note: CloudFront requires certificates to be in us-east-1
  AppCertificate:
    Type: AWS::CertificateManager::Certificate
    Condition: IsPublicMode
    DeletionPolicy: Delete
    UpdateReplacePolicy: Retain
    Properties:
      DomainName: !Ref DomainName
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId
      ValidationMethod: DNS
      SubjectAlternativeNames:
        - !Sub '*.${DomainName}'
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: !Ref ServiceTag
        - Key: Component
          Value: !Ref ComponentTag
        - Key: CreatedBy
          Value: CloudFormation

  # SNS Topic for Contact Form Notifications
  ContactFormTopic:
    Type: AWS::SNS::Topic
    Condition: CreateSNSTopic
    Properties:
      TopicName: !Sub roboledger-app-${Environment}-contact-form
      DisplayName: !Sub RoboLedger ${Environment} Contact Form
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: !Ref ServiceTag
        - Key: Component
          Value: !Ref ComponentTag
        - Key: CreatedBy
          Value: CloudFormation

  # Email Subscription for Contact Form
  ContactFormEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: CreateSNSTopic
    Properties:
      Protocol: email
      TopicArn: !Ref ContactFormTopic
      Endpoint: !Ref NotificationEmail

  # Task execution role: pulls the image, writes logs, and resolves the
  # container's secrets at task start
  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    DeletionPolicy: Delete
    UpdateReplacePolicy: Retain
    Properties:
      RoleName: !Sub roboledger-${Environment}-ecs-execution
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: SecretsManagerAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Ref RoboSystemsSecretsArn
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: !Ref ServiceTag
        - Key: Component
          Value: !Ref ComponentTag
        - Key: CreatedBy
          Value: CloudFormation

  # Task role: what the running app itself may call (contact-form mail)
  ECSTaskRole:
    Type: AWS::IAM::Role
    DeletionPolicy: Delete
    UpdateReplacePolicy: Retain
    Properties:
      RoleName: !Sub roboledger-${Environment}-ecs-task
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - !If
          - CreateSNSTopic
          - PolicyName: SNSPublishPolicy
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - sns:Publish
                  Resource:
                    - !Ref ContactFormTopic
          - !Ref AWS::NoValue
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: !Ref ServiceTag
        - Key: Component
          Value: !Ref ComponentTag
        - Key: CreatedBy
          Value: CloudFormation

  # Infrastructure role: lets ECS provision the load balancer, security
  # groups, certificate and scaling policies Express Mode manages
  ECSInfrastructureRole:
    Type: AWS::IAM::Role
    DeletionPolicy: Delete
    UpdateReplacePolicy: Retain
    Properties:
      RoleName: !Sub roboledger-${Environment}-ecs-infrastructure
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSInfrastructureRoleforExpressGatewayServices
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: !Ref ServiceTag
        - Key: Component
          Value: !Ref ComponentTag
        - Key: CreatedBy
          Value: CloudFormation

  # ECS Express Mode Service. Public subnets (the default VPC's unless
  # Subnets is set) give an internet-facing ALB, shared by up to 25 Express
  # services in the VPC; private subnets would give an internal ALB that
  # CloudFront cannot reach. Tags cannot change after create: editing them
  # replaces the service.
  ECSExpressService:
    Type: AWS::ECS::ExpressGatewayService
    DeletionPolicy: Delete
    UpdateReplacePolicy: Retain
    Properties:
      ServiceName: !Sub roboledger-${Environment}
      ExecutionRoleArn: !GetAtt ECSTaskExecutionRole.Arn
      InfrastructureRoleArn: !GetAtt ECSInfrastructureRole.Arn
      TaskRoleArn: !GetAtt ECSTaskRole.Arn
      Cpu: !Ref Cpu
      Memory: !Ref Memory
      HealthCheckPath: /api/utilities/health
      NetworkConfiguration: !If
        - HasSubnets
        - Subnets: !Ref Subnets
        - !Ref AWS::NoValue
      PrimaryContainer:
        Image: !Sub ${AWSAccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ECRRepository}:${ECRImageTag}
        ContainerPort: !Ref ContainerPort
        Environment:
          - Name: NODE_ENV
            Value: production
          - Name: SNS_CONTACT_TOPIC_ARN
            Value: !If [CreateSNSTopic, !Ref ContactFormTopic, '']
          - Name: REQUIRE_CAPTCHA
            Value: 'true'
          # Bucket holding report bundles; the holon proxy fetches only from it.
          - Name: REPORT_BUNDLE_BUCKET
            Value: !Sub robosystems-${AWS::AccountId}-user-${Environment}
          - Name: ORIGIN_VERIFY_SECRET
            Value: !Ref OriginVerifySecret
        Secrets:
          - Name: TURNSTILE_SECRET_KEY
            ValueFrom: !Sub '${RoboSystemsSecretsArn}:TURNSTILE_SECRET_KEY::'
      ScalingTarget:
        MinTaskCount: !Ref CapacityMin
        MaxTaskCount: !Ref CapacityMax
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: !Ref ServiceTag
        - Key: Component
          Value: !Ref ComponentTag
        - Key: CreatedBy
          Value: CloudFormation

  # Bucket Policy for CloudFront Access
  StaticAssetsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref StaticAssetsBucketName
      PolicyDocument:
        Statement:
          - Sid: AllowCloudFrontServicePrincipal
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${StaticAssetsBucketArn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}
          # Enforce TLS: deny any request made over plain HTTP.
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !Ref StaticAssetsBucketArn
              - !Sub ${StaticAssetsBucketArn}/*
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  # CloudFront Origin Access Control
  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub roboledger-${Environment}-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Cache policy for the next/image optimizer (`/_next/image?url=…&w=…&q=…`).
  # The default behavior is CachingDisabled, so without this every optimized
  # image would reach the app. Key on the optimizer's query and on Accept
  # (it serves webp to browsers that accept it and answers `Vary: Accept`),
  # and honor its `max-age` (14400s by default).
  NextImageCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub roboledger-${Environment}-next-image
        Comment: next/image optimizer responses keyed on url/w/q and Accept
        MinTTL: 1
        DefaultTTL: 14400
        MaxTTL: 31536000
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          CookiesConfig:
            CookieBehavior: none
          HeadersConfig:
            HeaderBehavior: whitelist
            Headers:
              - Accept
          QueryStringsConfig:
            QueryStringBehavior: whitelist
            QueryStrings:
              - url
              - w
              - q

  # Cache policy for the social cards (the blog post card at its stable
  # og.png URL and the opengraph-image / twitter-image conventions). A card
  # changes only when a post's title or excerpt does. The conventions answer
  # `max-age=0`, so the floor is set here rather than taken from the origin;
  # nothing but the path identifies a card, so nothing else is in the key.
  SocialCardCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub roboledger-${Environment}-social-card
        Comment: Social card images keyed on path only
        MinTTL: 3600
        DefaultTTL: 86400
        MaxTTL: 604800
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: false
          EnableAcceptEncodingBrotli: false
          CookiesConfig:
            CookieBehavior: none
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  # CloudFront Distribution
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub RoboLedger ${Environment} Distribution
        Enabled: true
        PriceClass: PriceClass_100 # Use only North America and Europe for cost savings
        HttpVersion: http2
        # Aliases only for public mode (custom domain)
        Aliases: !If
          - IsPublicMode
          - [!Ref DomainName]
          - !Ref AWS::NoValue
        # Certificate configuration depends on mode
        ViewerCertificate: !If
          - IsPublicMode
          - AcmCertificateArn: !Ref AppCertificate
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        DefaultRootObject: ''
        Origins:
          # Origin for static assets (S3)
          - Id: S3-Static-Assets
            DomainName: !Ref StaticAssetsBucketDomainName
            S3OriginConfig:
              OriginAccessIdentity: ''
            OriginAccessControlId: !Ref CloudFrontOAC
          # Origin for dynamic content (ECS Express)
          # The Express endpoint always uses HTTPS
          - Id: App-Dynamic-Content
            DomainName:
              !Join [
                '',
                !Split ['https://', !GetAtt ECSExpressService.Endpoint],
              ]
            OriginCustomHeaders: !If
              - HasOriginVerifySecret
              - - HeaderName: X-Origin-Verify
                  HeaderValue: !Ref OriginVerifySecret
              - !Ref AWS::NoValue
            CustomOriginConfig:
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
        DefaultCacheBehavior:
          TargetOriginId: App-Dynamic-Content
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - DELETE
            - GET
            - HEAD
            - OPTIONS
            - PATCH
            - POST
            - PUT
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # CachingDisabled managed policy
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # AllViewerExceptHostHeader managed policy
        CacheBehaviors:
          # Social cards: rendered by the app, so served from the edge.
          - PathPattern: /blog/*/og.png
            TargetOriginId: App-Dynamic-Content
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
            CachedMethods:
              - GET
              - HEAD
            Compress: false
            CachePolicyId: !Ref SocialCardCachePolicy
          - PathPattern: /blog/*/opengraph-image*
            TargetOriginId: App-Dynamic-Content
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
            CachedMethods:
              - GET
              - HEAD
            Compress: false
            CachePolicyId: !Ref SocialCardCachePolicy
          - PathPattern: /blog/*/twitter-image*
            TargetOriginId: App-Dynamic-Content
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
            CachedMethods:
              - GET
              - HEAD
            Compress: false
            CachePolicyId: !Ref SocialCardCachePolicy
          - PathPattern: /blog/opengraph-image*
            TargetOriginId: App-Dynamic-Content
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
            CachedMethods:
              - GET
              - HEAD
            Compress: false
            CachePolicyId: !Ref SocialCardCachePolicy
          - PathPattern: /blog/twitter-image*
            TargetOriginId: App-Dynamic-Content
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
            CachedMethods:
              - GET
              - HEAD
            Compress: false
            CachePolicyId: !Ref SocialCardCachePolicy
          - PathPattern: /opengraph-image*
            TargetOriginId: App-Dynamic-Content
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
            CachedMethods:
              - GET
              - HEAD
            Compress: false
            CachePolicyId: !Ref SocialCardCachePolicy
          - PathPattern: /twitter-image*
            TargetOriginId: App-Dynamic-Content
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
            CachedMethods:
              - GET
              - HEAD
            Compress: false
            CachePolicyId: !Ref SocialCardCachePolicy
          # next/image optimizer output. Only the cache-key parts (url/w/q,
          # Accept) are forwarded; the optimizer needs nothing else.
          - PathPattern: /_next/image*
            TargetOriginId: App-Dynamic-Content
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
            CachedMethods:
              - GET
              - HEAD
            Compress: true
            CachePolicyId: !Ref NextImageCachePolicy
          # Cache behavior for static assets
          - PathPattern: /images/*
            TargetOriginId: S3-Static-Assets
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachedMethods:
              - GET
              - HEAD
            Compress: true
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # CachingOptimized managed policy
          - PathPattern: /_next/static/*
            TargetOriginId: S3-Static-Assets
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachedMethods:
              - GET
              - HEAD
            Compress: true
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # CachingOptimized managed policy
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: !Ref ServiceTag
        - Key: Component
          Value: !Ref ComponentTag
        - Key: CreatedBy
          Value: CloudFormation

  # CloudFront Function for www to apex redirect
  # Only created for production + public mode (requires custom domain)
  WwwRedirectFunction:
    Type: AWS::CloudFront::Function
    Condition: IsProductionPublic
    Properties:
      Name: !Sub roboledger-app-${Environment}-www-redirect
      AutoPublish: true
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var host = request.headers.host.value;
          var uri = request.uri;
          var querystring = request.querystring;

          // Build the redirect URL
          var newHost = host.replace(/^www\./, '');
          var qs = '';

          // Reconstruct query string if present (URL encode to prevent malformed redirects)
          if (Object.keys(querystring).length > 0) {
            var params = [];
            for (var key in querystring) {
              var param = querystring[key];
              var encodedKey = encodeURIComponent(key);
              if (param.multiValue) {
                param.multiValue.forEach(function(v) {
                  params.push(encodedKey + '=' + encodeURIComponent(v.value));
                });
              } else if (param.value) {
                params.push(encodedKey + '=' + encodeURIComponent(param.value));
              } else {
                params.push(encodedKey);
              }
            }
            qs = '?' + params.join('&');
          }

          return {
            statusCode: 301,
            statusDescription: 'Moved Permanently',
            headers: {
              'location': { value: 'https://' + newHost + uri + qs },
              'cache-control': { value: 'max-age=31536000' }
            }
          };
        }
      FunctionConfig:
        Comment: Redirects www.roboledger.ai to roboledger.ai
        Runtime: cloudfront-js-2.0

  # CloudFront Distribution for www redirect
  # Only created for production + public mode (requires custom domain)
  WwwCloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Condition: IsProductionPublic
    Properties:
      DistributionConfig:
        Comment: !Sub RoboLedger ${Environment} WWW Redirect Distribution
        Enabled: true
        PriceClass: PriceClass_100
        HttpVersion: http2
        Aliases:
          - !Sub www.${DomainName}
        ViewerCertificate:
          AcmCertificateArn: !Ref AppCertificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          # Dummy origin - required by CloudFront but never hit because the function redirects
          - Id: Dummy-Origin
            DomainName:
              !Join [
                '',
                !Split ['https://', !GetAtt ECSExpressService.Endpoint],
              ]
            CustomOriginConfig:
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
        DefaultCacheBehavior:
          TargetOriginId: Dummy-Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
          CachedMethods:
            - GET
            - HEAD
          Compress: false
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # CachingOptimized managed policy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt WwwRedirectFunction.FunctionARN
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: !Ref ServiceTag
        - Key: Component
          Value: !Ref ComponentTag
        - Key: CreatedBy
          Value: CloudFormation

  # Route 53 App Domain Record (only for public mode with custom domain)
  Route53Record:
    Type: AWS::Route53::RecordSet
    Condition: IsPublicMode
    DeletionPolicy: Delete
    UpdateReplacePolicy: Retain
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Type: A
      Name: !Ref DomainName
      AliasTarget:
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2 # CloudFront's hosted zone ID
        EvaluateTargetHealth: false

  # Route 53 Record for www subdomain (only for production + public mode)
  WwwRoute53Record:
    Type: AWS::Route53::RecordSet
    Condition: IsProductionPublic
    DeletionPolicy: Delete
    UpdateReplacePolicy: Retain
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Type: A
      Name: !Sub www.${DomainName}
      AliasTarget:
        DNSName: !GetAtt WwwCloudFrontDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2 # CloudFront's hosted zone ID
        EvaluateTargetHealth: false

Outputs:
  AppAccessMode:
    Description: Access mode for the application
    Value: !Ref AppAccessMode

  AppURL:
    Description: URL of the Application
    Value: !If
      - IsPublicMode
      - !Sub https://${DomainName}
      - !Sub https://${CloudFrontDistribution.DomainName}

  ServiceUrl:
    Description: ECS Express service endpoint (direct access)
    Value: !Join ['', !Split ['https://', !GetAtt ECSExpressService.Endpoint]]

  ServiceArn:
    Description: ECS Express service ARN
    Value: !GetAtt ECSExpressService.ServiceArn

  CertificateArn:
    Condition: IsPublicMode
    Description: ACM Certificate ARN
    Value: !Ref AppCertificate

  CloudFrontDistributionId:
    Description: CloudFront Distribution ID
    Value: !Ref CloudFrontDistribution

  CloudFrontDomainName:
    Description: CloudFront Distribution Domain Name
    Value: !GetAtt CloudFrontDistribution.DomainName

  WwwCloudFrontDistributionId:
    Condition: IsProductionPublic
    Description: CloudFront Distribution ID for WWW redirect
    Value: !Ref WwwCloudFrontDistribution

  WwwCloudFrontDomainName:
    Condition: IsProductionPublic
    Description: CloudFront Distribution Domain Name for WWW redirect
    Value: !GetAtt WwwCloudFrontDistribution.DomainName

  StaticAssetsBucketName:
    Description: S3 Bucket for static assets
    Value: !Ref StaticAssetsBucketName

  Region:
    Description: AWS Region where the stack is deployed
    Value: !Ref AWS::Region

  ContactFormTopicArn:
    Condition: CreateSNSTopic
    Description: SNS Topic ARN for contact form notifications
    Value: !Ref ContactFormTopic

  # Access Mode Instructions
  PublicAccessInstructions:
    Condition: IsPublicMode
    Description: Instructions for accessing the app (public mode with custom domain)
    Value: !Sub |
      App is configured for public access with custom domain.

      URL: https://${DomainName}

      CloudFront Distribution: ${CloudFrontDistribution.DomainName}
      ECS Express Service: ${ECSExpressService.Endpoint}

  PublicHttpAccessInstructions:
    Condition: IsPublicHttpMode
    Description: Instructions for accessing the app (public-http mode)
    Value: !Sub |
      App is configured for public HTTP access (no custom domain).

      URL: https://${CloudFrontDistribution.DomainName}

      This uses CloudFront's default domain with HTTPS.
      ECS Express Service: ${ECSExpressService.Endpoint}

